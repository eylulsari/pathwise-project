# ─────────────────────────────────────────────────────────────
# Pathwise — full stack: frontend, backend, postgres, redis
# Bring everything up with:  docker compose up --build
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: pathwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathwise_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pathwise}
    ports:
      - "5432:5432"
    volumes:
      - pathwise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathwise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pathwise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pathwise-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pathwise-backend
      target: development # multi-stage: dev target with hot-reload
    container_name: pathwise-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      # Both spellings of the dev host: a browser opened on 127.0.0.1 sends a
      # different Origin than one opened on localhost, and either is a normal
      # way to reach the dev server. Allowing only one turns a host-name choice
      # into a wall of CORS failures that look like the app is broken.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-pathwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathwise_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pathwise}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Dev/CI: raise the auth rate limit so the E2E suite (many sign-ups) isn't
      # throttled. Keep the default (10) in production.
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-100}
      # Optional — weather falls back to mock data if unset. (Never committed.)
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # Optional — AI assistant uses Groq first, then Gemini, and falls back to
      # canned answers when neither key is set.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "3000:3000"
    volumes:
      - ./pathwise-backend/src:/app/src
      - ./pathwise-backend/test:/app/test

  frontend:
    build:
      context: ./pathwise
    container_name: pathwise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      # Bind-mounts (esp. on Windows/macOS) don't forward inotify events into
      # the container, so Vite HMR misses edits. Poll the filesystem instead.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./pathwise/src:/app/src
      # Bind-mount the build config too, so theme/PostCSS edits reach the
      # running dev server (editing only /src otherwise leaves a stale config
      # baked into the image → e.g. `@apply` on new tokens fails).
      - ./pathwise/tailwind.config.js:/app/tailwind.config.js
      - ./pathwise/postcss.config.js:/app/postcss.config.js

volumes:
  pathwise-pgdata:
  pathwise-redisdata:
