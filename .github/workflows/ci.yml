name: CI

on:
  push:
    # This repo's default branch is `master`. It said `main` for months, so no
    # push ever triggered CI — and since the workflow is solo-developer with no
    # PRs, that meant CI effectively never ran at all.
    branches: [master]
  pull_request:

jobs:
  # The backend place/hub datasets are the single source of truth, and
  # pathwise/src/hubData.ts is generated from them. Without this job the two
  # can drift apart again the moment someone edits the backend and forgets to
  # regenerate — which is exactly how they diverged by 13 places the first
  # time, undetected, for months. Runs on its own so a stale artifact is
  # reported as a stale artifact, not as a confusing test failure downstream.
  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-frontend-places.mjs --check

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathwise-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test # unit tests use in-memory data + mocks — no DB needed

  # Twice a feature has shipped an @Entity with no migration to create its
  # table. Dev runs with synchronize:true, so TypeORM built the table locally
  # and every other job here passed against a schema the migrations had never
  # produced; production runs with synchronize:false and had no table at all.
  # Nothing above can catch that, because it all stands on the mechanism doing
  # the hiding. This job builds the schema from migrations alone, on an empty
  # database, and compares it to the entities.
  migrations:
    name: Migrations build the schema the entities describe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathwise-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pathwise
          POSTGRES_PASSWORD: pathwise_dev_password
          # A scratch database, empty and used by nothing else. The check
          # refuses to run against a database that already has tables — a pass
          # obtained that way would prove nothing, quietly.
          POSTGRES_DB: pathwise_migcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise-backend/package-lock.json
      - run: npm ci
      # The migration CLI runs against dist/, not src/.
      - run: npm run build
      - run: npm run migration:check
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: pathwise
          POSTGRES_PASSWORD: pathwise_dev_password
          POSTGRES_DB: pathwise_migcheck

  frontend:
    name: Frontend (lint + type-check + i18n + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Explicit step so a type error is reported as a type error rather than
      # as a build failure. `tsc -b`, NOT `tsc --noEmit`: the root tsconfig is
      # solution-style ("files": [] + references), so --noEmit checks nothing.
      - run: npm run typecheck
      - run: npm run i18n:check # a missing translation silently ships English
      - run: npm run build

  e2e:
    name: E2E (Playwright against full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise/package-lock.json

      - name: Start the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"; docker compose logs backend; exit 1

      - name: Install Playwright + browser
        working-directory: pathwise
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: pathwise
        run: npm run e2e

      - name: Tear down
        if: always()
        run: docker compose down

      # Both paths, because they answer different questions: the HTML report
      # says which test failed and why, `test-results/` carries the traces,
      # screenshots and error context for the ones that did.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            pathwise/playwright-report/
            pathwise/test-results/
          # Without if-no-files-found the step passes quietly when it uploads
          # nothing, which is how a red E2E job stayed undiagnosable for two
          # pushes: the artifact was missing and the only sign was a warning
          # annotation nobody reads.
          if-no-files-found: error
          retention-days: 7
