name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathwise-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test # unit tests use in-memory data + mocks — no DB needed

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise/package-lock.json
      - run: npm ci
      - run: npm run build # runs `tsc -b` (type-check) then `vite build`

  e2e:
    name: E2E (Playwright against full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathwise/package-lock.json

      - name: Start the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"; docker compose logs backend; exit 1

      - name: Install Playwright + browser
        working-directory: pathwise
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: pathwise
        run: npm run e2e

      - name: Tear down
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: pathwise/playwright-report/
          retention-days: 7
